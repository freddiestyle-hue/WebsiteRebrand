<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Modal anatomy</title>
<link rel="stylesheet" href="_card.css"/><style>
  .frame { padding: 0; background: rgba(14,26,44,0.78); display: flex; align-items: center; justify-content: center; min-height: 280px; position: relative; }
  .modal { background: var(--paper); border: var(--bw-hair) solid var(--ink); padding: 22px 24px 20px; max-width: 420px; width: 90%; position: relative; box-shadow: 0 8px 24px -10px rgba(14,26,44,0.18); }
  .esc { position: absolute; top: 12px; right: 12px; font-family: var(--mono); font-size: 9.5px; letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--ink-faint); border: var(--bw-hair) solid var(--line); padding: 5px 8px; background: transparent; }
  .stamp-x { color: var(--accent-deep); font-size: 10.5px; }
  h3 { font-family: var(--grotesk); font-weight: 700; font-size: 22px; line-height: 1.15; letter-spacing: var(--track-h-md); margin: 10px 0 6px; }
  h3 .ital { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--ink-dim); }
  p { margin: 0 0 14px; font-size: 13px; color: var(--ink-dim); line-height: 1.55; }
  .row { display: flex; gap: 8px; }
  .btn { display: inline-flex; padding: 9px 14px; font-family: var(--mono); font-size: 10px; letter-spacing: var(--track-mono); text-transform: uppercase; }
  .btn.s { background: var(--ink); color: var(--on-ink); border: var(--bw-hair) solid var(--ink); }
  .btn.o { background: transparent; color: var(--ink); border: var(--bw-hair) solid var(--ink); }
</style></head><body>
<div class="frame">
  <div class="modal">
    <button class="esc">[ESC] Close</button>
    <span class="stamp-x">Two-week engagement &middot; &pound;4k</span>
    <h3>Book the diagnostic. <span class="ital">No retainer required.</span></h3>
    <p>Senior eyes on your funnel, your spend, and the next ninety days. One document, one decision.</p>
    <div class="row"><button class="btn s">Book diagnostic &rarr;</button><button class="btn o">Cancel</button></div>
  </div>
</div>
</body></html>
