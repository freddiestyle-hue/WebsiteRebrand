<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Pull quote · top + bottom rule</title>
<link rel="stylesheet" href="_card.css"/><style>
  .pull { padding: 24px 4px; border-top: var(--bw-hair) solid var(--ink); border-bottom: var(--bw-hair) solid var(--ink); }
  blockquote { margin: 0; font-family: var(--serif); font-style: italic; font-size: 26px; line-height: 1.2; letter-spacing: var(--track-h-sm); color: var(--ink); text-wrap: balance; }
  cite { display: block; margin-top: 14px; font-style: normal; font-family: var(--mono); font-size: 10.5px; letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--ink-faint); }
</style></head><body>
<div class="pull">
  <blockquote>"The work isn't to ship more. It's to ship the right thing, instrumented, on the right cadence."</blockquote>
  <cite>— field note 04 · Cadence over volume</cite>
</div>
</body></html>
