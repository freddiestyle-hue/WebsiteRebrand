<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>End-CTA · the dark closer</title>
<link rel="stylesheet" href="_card.css"/><style>
  .end { background: var(--ink); color: var(--on-ink); padding: 24px 28px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 28px; align-items: center; }
  h3 { font-family: var(--grotesk); font-weight: 700; font-size: 22px; line-height: 1.1; letter-spacing: var(--track-h-md); margin: 0; color: var(--on-ink); text-wrap: balance; }
  h3 .ital { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--on-ink-italic); letter-spacing: -0.02em; }
  .right { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .stamp-x { color: var(--on-ink-faint); font-size: 10.5px; }
  .stamp-x::before { background: var(--accent); }
  p { color: var(--on-ink-dim); margin: 0; font-size: 13px; line-height: 1.55; max-width: 260px; }
  .btn-inv { display: inline-flex; padding: 11px 18px; background: var(--paper); color: var(--ink); font-family: var(--mono); font-size: 11px; letter-spacing: var(--track-mono); text-transform: uppercase; }
</style></head><body>
<div class="end">
  <h3>If your numbers are live but the next move is unclear, <span class="ital">that's the diagnostic.</span></h3>
  <div class="right">
    <span class="stamp-x">TWO-WEEK ENGAGEMENT</span>
    <p>£4k. No retainer required to start.</p>
    <a class="btn-inv">Book diagnostic →</a>
  </div>
</div>
</body></html>
