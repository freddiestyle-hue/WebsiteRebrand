<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Type · Mono stamps</title>
<link rel="stylesheet" href="_card.css" />
<style>

  .stack { display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: var(--bw-hair) solid var(--line); }
  .row.dark { background: var(--ink); }
  .stamp-x { color: var(--accent-deep); }
  .stamp-x.n { color: var(--ink-faint); }
  .stamp-x.n::before { background: var(--ink-faint); }
  .stamp-x.d { color: var(--on-ink-faint); }
  .stamp-x.d::before { background: var(--accent); }
  .stamp-sm { font-size: 9.5px; }
  .stamp-sm::before { width: 6px; height: 6px; margin-right: 8px; }
  .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--ink-faint); }
  .row.dark .lbl { color: var(--on-ink-faint); }

</style>
</head>
<body>

<div class="stack">
  <div class="row">
    <span class="stamp-x">A SENIOR PRACTICE · CAPE TOWN</span>
    <span class="lbl">default · accent-deep</span>
  </div>
  <div class="row">
    <span class="stamp-x n">FIELD NOTE · 04</span>
    <span class="lbl">neutral · ink-faint</span>
  </div>
  <div class="row dark">
    <span class="stamp-x d">TWO-WEEK ENGAGEMENT</span>
    <span class="lbl">on-dark</span>
  </div>
  <div class="row">
    <span class="stamp-x stamp-sm">SM · 10.5PX · INLINE</span>
    <span class="lbl">small · sm</span>
  </div>
</div>

</body>
</html>
