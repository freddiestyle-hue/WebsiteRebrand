<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Numbox · sage tint, accent rail</title>
<link rel="stylesheet" href="_card.css"/><style>
  .numbox { background: var(--sage); padding: 16px 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; border-left: 3px solid var(--accent-deep); }
  .numbox .k { font-family: var(--mono); font-size: 10px; letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--accent-deep); display: block; margin-bottom: 4px; }
  .numbox .v { font-family: var(--grotesk); font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: var(--track-tighter); }
  .numbox .v .ital { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--ink-dim); }
</style></head><body>
<div class="numbox">
  <div><span class="k">Diagnostic</span><span class="v">02 <span class="ital">wks</span></span></div>
  <div><span class="k">Build</span><span class="v">04–06 <span class="ital">wks</span></span></div>
  <div><span class="k">Run</span><span class="v">£12k <span class="ital">/ mo</span></span></div>
  <div><span class="k">First read</span><span class="v">14 <span class="ital">days</span></span></div>
</div>
</body></html>
