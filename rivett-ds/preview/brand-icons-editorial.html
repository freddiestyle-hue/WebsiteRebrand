<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Icons · editorial</title>
<link rel="stylesheet" href="_card.css"/><style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); border: var(--bw-hair) solid var(--line); }
  .cell { padding: 18px 8px 12px; border-right: var(--bw-hair) solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 110px; justify-content: center; }
  .cell:last-child { border-right: 0; }
  .cell svg { width: 32px; height: 32px; fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }
  .cell svg .dot { fill: var(--accent); stroke: none; }
  .cell svg .fill { fill: var(--ink); stroke: none; }
  .cell .name { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); text-align: center; }
</style></head><body>
<div class="grid">
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M5 3 H15 L19 7 V21 H5 Z"/><path d="M8 11 H16 M8 15 H16 M8 19 H13"/></svg><span class="name">memo</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13"/><path d="M3 6 L12 14 L21 6"/></svg><span class="name">outreach</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M6 4 H18 L20 6 V20 H4 V6 Z"/><path d="M8 10 H16 M8 14 H16"/><circle class="dot" cx="6" cy="4" r="1.4"/></svg><span class="name">field-note</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M5 5 H10 V19 H5 Z M14 5 H19 V19 H14 Z"/></svg><span class="name">archive</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M4 9 L4 5 L20 5 L20 9 M12 5 V19 M8 19 H16"/></svg><span class="name">type</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M5 5 L19 5 M5 12 L19 12 M5 19 L13 19"/></svg><span class="name">contents</span></div>
</div>
</body></html>
