<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Icons · metric</title>
<link rel="stylesheet" href="_card.css"/><style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); border: var(--bw-hair) solid var(--line); }
  .cell { padding: 18px 8px 12px; border-right: var(--bw-hair) solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 110px; justify-content: center; }
  .cell:last-child { border-right: 0; }
  .cell svg { width: 32px; height: 32px; fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }
  .cell svg .dot { fill: var(--accent); stroke: none; }
  .cell svg .fill { fill: var(--ink); stroke: none; }
  .cell .name { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); text-align: center; }
</style></head><body>
<div class="grid">
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M3 21 V11 H7 V21 Z M10 21 V5 H14 V21 Z M17 21 V15 H21 V21 Z"/></svg><span class="name">numbers</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 12 L12 3 M12 12 L21 12"/><circle class="dot" cx="12" cy="12" r="1.2"/></svg><span class="name">share</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M3 17 Q9 17 12 11 T21 5"/><path d="M3 21 H21"/><circle class="dot" cx="21" cy="5" r="1.6"/></svg><span class="name">curve</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg><span class="name">cohort</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M3 12 H8 L10 6 L14 18 L16 12 H21"/><circle class="dot" cx="14" cy="18" r="1.4"/></svg><span class="name">vital</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M4 20 L12 4 L20 20 Z"/><path d="M12 11 V15"/><circle class="fill" cx="12" cy="17.5" r="0.8"/></svg><span class="name">flag</span></div>
</div>
</body></html>
