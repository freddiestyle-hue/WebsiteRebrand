<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Nav · wordmark · meta · CTA</title>
<link rel="stylesheet" href="_card.css"/><style>
  .nav { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border: var(--bw-hair) solid var(--line); border-bottom: var(--bw-hair) solid var(--line); flex-wrap: wrap; gap: 16px; }
  .wm { display: inline-flex; align-items: center; gap: 0.1em; font-family: var(--grotesk); font-weight: 700; font-size: 24px; letter-spacing: -0.05em; line-height: 1; color: var(--ink); }
  .wm .dot { display: inline-block; width: 0.32em; height: 0.32em; border-radius: var(--r-pill); background: var(--accent); transform: translateY(0.04em); }
  .links { display: flex; gap: 22px; font-family: var(--mono); font-size: 10.5px; letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--ink-faint); }
  .cta { display: inline-flex; padding: 9px 14px; border: var(--bw-hair) solid var(--ink); background: var(--ink); color: var(--on-ink); font-family: var(--mono); font-size: 10.5px; letter-spacing: var(--track-mono); text-transform: uppercase; }
</style></head><body>
<div class="nav">
  <span class="wm">rivett<span class="dot"></span></span>
  <div class="links"><a>The work</a><a>Field notes</a><a>Revenue MRI</a><a>About</a></div>
  <a class="cta">Book diagnostic →</a>
</div>
</body></html>
