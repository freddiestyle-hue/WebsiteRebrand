<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Icons · functional</title>
<link rel="stylesheet" href="_card.css"/><style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); border: var(--bw-hair) solid var(--line); }
  .cell { padding: 18px 8px 12px; border-right: var(--bw-hair) solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 110px; justify-content: center; }
  .cell:last-child { border-right: 0; }
  .cell svg { width: 32px; height: 32px; fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }
  .cell svg .dot { fill: var(--accent); stroke: none; }
  .cell svg .fill { fill: var(--ink); stroke: none; }
  .cell .name { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); text-align: center; }
</style></head><body>
<div class="grid">
  <div class="cell"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="M8 12 L11 15 L17 9"/></svg><span class="name">approval</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 8 L16 16 M16 8 L8 16"/></svg><span class="name">decline</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/><path d="M9 12 H15"/></svg><span class="name">halt</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M14 4 L20 4 L20 10 M20 4 L11 13 M5 12 V19 H19 V14"/></svg><span class="name">external</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M5 12 H19 M13 6 L19 12 L13 18"/></svg><span class="name">arrow</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 12 L11 14 L15 10"/><circle class="dot" cx="12" cy="12" r="1.2"/></svg><span class="name">confirm</span></div>
</div>
</body></html>
